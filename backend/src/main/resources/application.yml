server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: votevox-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:votevox}
    username: ${DB_USER:votevox}
    password: ${DB_PASSWORD:votevox_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

votevox:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-32chars-min}
    expiration-ms: 86400000
  cors:
    # Comma-separated list of origin PATTERNS (wildcards allowed). Covers both
    # http and https (UIs run on HTTPS via mkcert) and localhost + private LAN
    # ranges on any port, so phone/LAN access works without reconfiguring.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*,http://192.168.*:*,https://192.168.*:*,http://10.*:*,https://10.*:*,http://172.*:*,https://172.*:*,https://*.trycloudflare.com}
  qr:
    base-url: ${QR_BASE_URL:http://localhost:5173/vote}
  backup:
    directory: ./backups

logging:
  level:
    org.springframework.security: INFO
    at.htlwels.votevox: INFO

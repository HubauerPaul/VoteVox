# Admin UI - served over HTTPS (same mkcert certificate as the voting UI).
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/votevox.pem;
    ssl_certificate_key /etc/nginx/certs/votevox-key.pem;

    root  /usr/share/nginx/html;
    index index.html;

    # Never cache the runtime config so an IP change is picked up on reload.
    location = /votevox-config.js {
        add_header Cache-Control "no-store";
    }

    # Proxy API calls to the backend container (same origin -> no CORS needed).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Admin uploads (CSV imports, etc.) may exceed the 1 MB default.
        client_max_body_size 25m;
    }

    # SPA fallback: every unknown path serves index.html (React Router).
    location / {
        try_files $uri /index.html;
    }
}

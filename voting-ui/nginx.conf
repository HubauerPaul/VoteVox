# Voting UI - served over HTTPS so the phone camera (getUserMedia) works.
# The certificate is generated by the launcher (mkcert) and mounted read-only.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/votevox.pem;
    ssl_certificate_key /etc/nginx/certs/votevox-key.pem;

    root  /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container (same origin -> no CORS needed).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every unknown path serves index.html (React Router).
    location / {
        try_files $uri /index.html;
    }
}
